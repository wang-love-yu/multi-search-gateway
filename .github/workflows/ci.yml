name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gateway_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements-test.txt
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
          TEST_POSTGRES_URL: postgresql+psycopg://gateway:ci-only-password@localhost:5432/gateway_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - run: python -m compileall -q backend/app scripts
  frontend-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: node scripts/build-csp.mjs frontend/out frontend/csp.caddy
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-and-lockfile
          path: |
            frontend/out
            frontend/package-lock.json
            frontend/csp.caddy
      - run: docker build -f deploy/Dockerfile -t msg-proxy-test .
      - run: docker run --rm -e DOMAIN=search.example.com msg-proxy-test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -f backend/Dockerfile -t msg-backend-test .
      - run: python scripts/init_env.py --domain search.example.com > /dev/null && docker compose config --quiet
